<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Verify Email • Happy Shopping</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    body { background: #f4f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }

    .verify-card {
      background: #fff;
      border-radius: 20px;
      padding: 56px 48px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(0,0,0,0.10);
      text-align: center;
    }

    .icon-circle {
      width: 90px; height: 90px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin: 0 auto 28px;
      animation: pop 0.5s cubic-bezier(.175,.885,.32,1.275) both;
    }
    .icon-circle.success { background: linear-gradient(135deg,#43e97b,#38f9d7); }
    .icon-circle.error   { background: linear-gradient(135deg,#ff6b6b,#ffa8a8); }
    .icon-circle.loading { background: linear-gradient(135deg,#a18cd1,#fbc2eb); }

    @keyframes pop {
      0%   { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .verify-title { font-size: 1.75rem; font-weight: 700; color: #1a1a2e; margin-bottom: 12px; }
    .verify-msg   { color: #666; font-size: 15px; line-height: 1.7; margin-bottom: 32px; }

    .btn-verify {
      background: linear-gradient(135deg,#ff6b9d,#c44dff);
      color: #fff; border: none;
      padding: 14px 40px;
      border-radius: 50px;
      font-size: 15px; font-weight: 600;
      text-decoration: none;
      display: inline-block;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-verify:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(196,77,255,0.35);
      color: #fff;
    }

    .spinner-ring {
      width: 56px; height: 56px;
      border: 5px solid #eee;
      border-top-color: #c44dff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="verify-card" id="verifyCard">
    <!-- Loading state -->
    <div id="stateLoading">
      <div class="spinner-ring"></div>
      <div class="verify-title">Verifying your email…</div>
      <div class="verify-msg">Please wait a moment.</div>
    </div>

    <!-- Success state (hidden initially) -->
    <div id="stateSuccess" style="display:none;">
      <div class="icon-circle success">✅</div>
      <div class="verify-title">Email Verified!</div>
      <div class="verify-msg">
        Your email has been successfully verified.<br>
        You can now log in and start shopping!
      </div>
      <a href="/login.html" class="btn-verify">Go to Login →</a>
    </div>

    <!-- Error state (hidden initially) -->
    <div id="stateError" style="display:none;">
      <div class="icon-circle error">❌</div>
      <div class="verify-title">Verification Failed</div>
      <div class="verify-msg" id="errorMsg">
        This link is invalid or has expired.
      </div>
      <div class="d-flex flex-column gap-3 align-items-center">
        <a href="/login.html" class="btn-verify">Back to Login</a>
        <a href="/register.html" style="color:#c44dff;font-size:14px;text-decoration:none;">
          Create a new account
        </a>
      </div>
    </div>
  </div>

  <script>
    (async () => {
      const params  = new URLSearchParams(window.location.search);
      const token   = params.get('token');

      const showSuccess = () => {
        document.getElementById('stateLoading').style.display = 'none';
        document.getElementById('stateSuccess').style.display = 'block';
      };
      const showError = (msg) => {
        document.getElementById('stateLoading').style.display = 'none';
        document.getElementById('stateError').style.display   = 'block';
        if (msg) document.getElementById('errorMsg').textContent = msg;
      };

      if (!token) return showError('No verification token found in the link.');

      try {
        const res  = await fetch(`/api/auth/verify-email?token=${encodeURIComponent(token)}`);
        const data = await res.json();
        if (data.ok) showSuccess();
        else         showError(data.message);
      } catch (err) {
        showError('Network error. Please try again.');
      }
    })();
  </script>

</body>
</html>

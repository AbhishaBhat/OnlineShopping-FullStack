<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Create Account</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="auth-page">
  <div id="siteNav"></div>
  <main class="container-main d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card-ui p-5" style="max-width: 550px; width: 100%;">
      <div id="formWrap">
        <h2 class="text-center mb-4" style="font-size: 2.5rem;">Create Account</h2>
        <p class="text-center text-muted mb-5">Join our shopping community and start exploring.</p>
        <form id="regForm" class="auth-form">
          <div class="row g-4">
            <div class="col-12">
              <input class="form-control w-100" id="full_name" name="full_name" placeholder="Full Display Name" required>
            </div>
            <div class="col-md-6">
              <input class="form-control w-100" id="email" type="email" name="email" placeholder="Email Address" required>
            </div>
            <div class="col-md-6">
              <input class="form-control w-100" id="phone" name="phone" placeholder="Active Phone" required>
            </div>
            <div class="col-12">
              <textarea class="form-control w-100" id="address" name="address" placeholder="Delivery Address" required></textarea>
            </div>
            <div class="col-md-6">
              <input class="form-control w-100" id="password" type="password" name="password"
                placeholder="Secure Password" required>
            </div>
            <div class="col-md-6">
              <input class="form-control w-100" id="confirm_password" type="password" placeholder="Confirm" required>
            </div>
          </div>
          <button class="btn w-100 mt-5" type="submit">Register</button>
        </form>
        <div id="msg" class="form-status text-center mt-3"></div>
        <p class="text-center text-muted small mt-5">Already have an account? <a href="/login.html" class="fw-bold"
            style="text-decoration: none;">Login Here</a></p>
      </div>
    </div>
  </main>
  <div id="siteFooter"></div>

  <script type="module">
    import { updateNav, fetchJson, isLoggedIn } from '/js/common.js';
    await updateNav();
    if (isLoggedIn()) { location.href = '/categories.html'; }

    const form   = document.getElementById('regForm');
    const msg    = document.getElementById('msg');
    const formWrap = document.getElementById('formWrap');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      msg.textContent = '';
      const formData = new FormData(form);
      if (formData.get('password') !== document.getElementById('confirm_password').value) {
        msg.innerHTML = '<span style="color:#e74c3c;">⚠️ Passwords do not match.</span>';
        return;
      }
      msg.textContent = 'Creating your account…';
      const data = Object.fromEntries(formData.entries());
      const res = await fetchJson('/api/auth/register', { method: 'POST', body: data });

      if (res.ok) {
        // Show email-sent success panel
        formWrap.innerHTML = `
          <div style="text-align:center;padding:24px 0;">
            <div style="font-size:64px;margin-bottom:16px;">📧</div>
            <h3 style="font-weight:700;color:#1a1a2e;margin-bottom:12px;">Check your inbox!</h3>
            <p style="color:#666;line-height:1.7;margin-bottom:24px;">
              We've sent a verification link to<br>
              <strong>${data.email}</strong>
            </p>
            <p style="color:#aaa;font-size:13px;line-height:1.6;">
              Click the link in the email to activate your account.<br>
              The link expires in <strong>24 hours</strong>.
            </p>
            <hr style="margin:24px 0;border-color:#eee;">
            <p style="font-size:13px;color:#aaa;">
              Didn't receive it?
              <button id="resendBtn" style="background:none;border:none;color:#c44dff;font-weight:600;cursor:pointer;padding:0;font-size:13px;">
                Resend verification email
              </button>
            </p>
          </div>`;
        document.getElementById('resendBtn').addEventListener('click', async () => {
          const r = await fetchJson('/api/auth/resend-verification', { method: 'POST', body: { email: data.email } });
          document.getElementById('resendBtn').textContent = r.ok ? '✅ Sent!' : '❌ ' + r.message;
        });
      } else if (res.notVerified) {
        msg.innerHTML = `
          <span style="color:#e67e22;">⚠️ ${res.message}</span><br>
          <button id="resendBtn2" style="margin-top:8px;background:linear-gradient(135deg,#ff6b9d,#c44dff);color:#fff;border:none;border-radius:20px;padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600;">
            Resend Verification Email
          </button>`;
        document.getElementById('resendBtn2').addEventListener('click', async () => {
          const r = await fetchJson('/api/auth/resend-verification', { method: 'POST', body: { email: data.email } });
          msg.innerHTML = r.ok
            ? '<span style="color:#27ae60;">✅ ' + r.message + '</span>'
            : '<span style="color:#e74c3c;">❌ ' + r.message + '</span>';
        });
      } else {
        msg.innerHTML = `<span style="color:#e74c3c;">❌ ${res.message || 'Unable to register.'}</span>`;
      }
    });
  </script>
</body>

</html>

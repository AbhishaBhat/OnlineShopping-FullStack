<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Login - Happy Shopping</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="auth-page">
  <div id="siteNav"></div>
  <main class="container-main auth-shell">
    <div class="card-ui auth-card">
      <p class="eyebrow">Secure access</p>
      <h2 class="auth-title">Welcome Back</h2>
      <p class="text-muted auth-subtitle">Sign in to continue shopping, track orders, and manage your wishlist.</p>

      <form id="loginForm" class="auth-form">
        <div>
          <label class="form-label">Login as</label>
          <div class="role-toggle" role="tablist" aria-label="Login role">
            <button class="role-option active" type="button" data-role="user">User</button>
            <button class="role-option" type="button" data-role="admin">Admin</button>
          </div>
          <input type="hidden" name="role" id="loginRole" value="user">
        </div>
        <div>
          <label class="form-label" for="email">Email address</label>
          <input class="form-control w-100" id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div>
          <label class="form-label" for="password">Password</label>
          <input class="form-control w-100" id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <button class="btn w-100" id="loginBtn" type="submit">Sign In</button>
      </form>

      <div id="msg" class="form-status" role="status" aria-live="polite"></div>
      <p class="auth-link text-muted">New customer? <a href="/register.html">Create Account</a></p>
    </div>
  </main>
  <div id="siteFooter"></div>

  <script type="module">
    import { updateNav, fetchJson, isLoggedIn, showToast, getProfile } from '/js/common.js';

    await updateNav();
    if (isLoggedIn()) {
      const profile = await getProfile();
      location.href = profile?.role === 'admin' ? '/admin.html' : '/categories.html';
    }

    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    const button = document.getElementById('loginBtn');
    const roleInput = document.getElementById('loginRole');

    document.querySelectorAll('.role-option').forEach(option => {
      option.addEventListener('click', () => {
        document.querySelectorAll('.role-option').forEach(item => item.classList.remove('active'));
        option.classList.add('active');
        roleInput.value = option.dataset.role;
        setStatus(option.dataset.role === 'admin' ? 'Admin login selected.' : 'User login selected.', 'info');
      });
    });

    function setStatus(message, type = 'info') {
      msg.className = `form-status status-${type}`;
      msg.textContent = message;
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();
      setStatus('Signing you in...', 'info');
      button.disabled = true;

      const body = Object.fromEntries(new FormData(form).entries());
      body.email = String(body.email || '').trim();
      const res = await fetchJson('/api/auth/login', { method: 'POST', body });

      button.disabled = false;

      if (res.ok && res.token) {
        localStorage.setItem('token', res.token);
        setStatus('Login successful. Redirecting...', 'success');
        showToast('Login successful', 'success');
        window.setTimeout(() => location.href = res.role === 'admin' ? '/admin.html' : '/categories.html', 900);
        return;
      }

      if (res.notVerified) {
        msg.className = 'form-status';
        msg.innerHTML = `
          <div class="auth-alert">
            <strong>Email not verified</strong>
            <p>Please check <strong>${res.email || body.email}</strong> for a verification link before logging in.</p>
            <button id="resendVerifyBtn" class="btn btn-secondary" type="button">Resend Verification Email</button>
          </div>`;

        document.getElementById('resendVerifyBtn').addEventListener('click', async () => {
          const btn = document.getElementById('resendVerifyBtn');
          btn.disabled = true;
          btn.textContent = 'Sending...';
          const r = await fetchJson('/api/auth/resend-verification', {
            method: 'POST',
            body: { email: res.email || body.email }
          });
          btn.textContent = r.ok ? 'Sent. Check your inbox.' : r.message || 'Unable to send';
          showToast(r.message || (r.ok ? 'Verification email sent' : 'Unable to send email'), r.ok ? 'success' : 'error');
        });
        return;
      }

      setStatus(res.message || 'Login failed. Please check your email and password.', 'error');
    });
  </script>
</body>

</html>

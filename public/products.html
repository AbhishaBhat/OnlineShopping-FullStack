<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Products</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
  <div id="siteNav"></div>
  <main class="container-main">
    <div class="mt-4">
      <a href="/categories.html" class="small">Back to collections</a>
      <section class="page-heading">
        <div>
          <p class="eyebrow">Shop catalog</p>
          <h1 id="catTitle">Products</h1>
        </div>
      </section>

      <section class="product-toolbar">
        <div>
          <label class="form-label" for="localSearch">Find products</label>
          <input id="localSearch" class="form-control" placeholder="Search this page">
        </div>
        <div>
          <label class="form-label" for="stockFilter">Stock</label>
          <select id="stockFilter" class="form-control">
            <option value="all">All stock</option>
            <option value="available">Available</option>
            <option value="low">Low stock</option>
          </select>
        </div>
        <div>
          <label class="form-label" for="sortBy">Sort by</label>
          <select id="sortBy" class="form-control">
            <option value="latest">Latest</option>
            <option value="price-asc">Price: low to high</option>
            <option value="price-desc">Price: high to low</option>
            <option value="stock-asc">Stock: low first</option>
          </select>
        </div>
      </section>

      <div id="prodList" class="card-grid">Loading...</div>
    </div>
  </main>
  <div id="siteFooter"></div>
  <script type="module">
    import {
      updateNav,
      fetchJson,
      isLoggedIn,
      redirectIfNotLoggedIn,
      updateNavCounts,
      formatCurrency,
      addToCart,
      showToast
    } from '/js/common.js';

    await updateNav();
    redirectIfNotLoggedIn();

    const params = new URLSearchParams(location.search);
    const cid = params.get('category_id') || params.get('cat');
    const searchQuery = params.get('q');
    const title = document.getElementById('catTitle');
    const list = document.getElementById('prodList');
    const localSearch = document.getElementById('localSearch');
    const stockFilter = document.getElementById('stockFilter');
    const sortBy = document.getElementById('sortBy');
    let currentProducts = [];

    [localSearch, stockFilter, sortBy].forEach(control => {
      control.addEventListener('input', applyProductControls);
      control.addEventListener('change', applyProductControls);
    });

    async function loadProducts() {
      list.innerHTML = '<div class="empty-state">Loading products...</div>';

      if (searchQuery) {
        title.innerHTML = `Search results for "<span class="text-gradient">${escapeHtml(searchQuery)}</span>"`;
        const url = `/api/products?q=${encodeURIComponent(searchQuery)}&limit=50`;
        const resp = await fetchJson(url);
        if (!resp.ok) {
          list.innerHTML = `<div class="notice">${resp.message || 'Unable to load products'}</div>`;
          return;
        }
        currentProducts = resp.products || [];
        applyProductControls();
        return;
      }

      if (!cid) {
        title.textContent = 'All products';
        const all = await fetchJson('/api/products?limit=50');
        if (!all.ok) {
          list.innerHTML = `<div class="notice">${all.message || 'Unable to load products'}</div>`;
          return;
        }
        currentProducts = all.products || [];
        applyProductControls();
        return;
      }

      const resp = await fetchJson(`/api/categories/${cid}/products`);
      if (!resp.ok) {
        list.innerHTML = `<div class="notice">${resp.message || 'Unable to load category'}</div>`;
        return;
      }
      let catName = 'Category';
      const cats = await fetchJson('/api/categories');
      if (cats.ok && Array.isArray(cats.categories)) {
        const found = cats.categories.find(c => String(c.id) === String(cid));
        if (found) catName = found.name;
      }
      title.textContent = catName;
      currentProducts = resp.products || [];
      applyProductControls();
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function applyProductControls() {
      const query = localSearch.value.trim().toLowerCase();
      const stockMode = stockFilter.value;
      const sortMode = sortBy.value;

      let items = [...currentProducts];
      if (query) {
        items = items.filter(p =>
          String(p.name || '').toLowerCase().includes(query) ||
          String(p.description || '').toLowerCase().includes(query)
        );
      }

      if (stockMode === 'available') items = items.filter(p => Number(p.stock || 0) > 0);
      if (stockMode === 'low') items = items.filter(p => Number(p.stock || 0) > 0 && Number(p.stock || 0) <= 5);

      items.sort((a, b) => {
        if (sortMode === 'price-asc') return Number(a.price || 0) - Number(b.price || 0);
        if (sortMode === 'price-desc') return Number(b.price || 0) - Number(a.price || 0);
        if (sortMode === 'stock-asc') return Number(a.stock || 0) - Number(b.stock || 0);
        return new Date(b.created_at || 0) - new Date(a.created_at || 0);
      });

      renderList(items);
    }

    function stockStatus(stock) {
      const count = Number(stock || 0);
      if (count <= 0) return { label: 'Out of stock', className: 'out' };
      if (count <= 5) return { label: `${count} left`, className: 'low' };
      return { label: `${count} in stock`, className: 'healthy' };
    }

    function productPlaceholder(name) {
      const text = encodeURIComponent(String(name || 'Product').slice(0, 32));
      return `https://placehold.co/600x450/111827/67e8f9?text=${text}`;
    }

    function productImageSrc(product) {
      return product.image_url || productPlaceholder(product.name);
    }

    function ratingSummary(product) {
      const average = Number(product.avg_rating || 0);
      const count = Number(product.review_count || 0);
      return count
        ? `${average.toFixed(1)} / 5 (${count} review${count === 1 ? '' : 's'})`
        : 'No reviews yet';
    }

    function renderList(items) {
      if (!items.length) {
        list.innerHTML = '<div class="empty-state">No products match your filters.</div>';
        return;
      }

      list.innerHTML = items.map(p => {
        const status = stockStatus(p.stock);
        const out = Number(p.stock || 0) <= 0;
        return `
          <div class="card-ui product-card">
            <div class="product-image-wrapper">
              <img src="${productImageSrc(p)}" alt="${escapeHtml(p.name)}" class="product-image" onerror="this.onerror=null;this.src='${productPlaceholder(p.name)}';">
            </div>
            <div class="mb-4">
              <h4 class="mb-2" style="font-size: 1.5rem;">${escapeHtml(p.name)}</h4>
              <div class="product-meta">
                <div class="badge">${formatCurrency(p.price)}</div>
                <span class="stock-pill ${status.className}">${status.label}</span>
              </div>
            </div>
            <p class="text-muted small mb-4" style="min-height: 48px;">${escapeHtml(p.description || 'Quality product for all your needs.')}</p>
            <section class="review-panel">
              <div class="review-summary">
                <span aria-hidden="true">★</span>
                <strong>${ratingSummary(p)}</strong>
              </div>
              <form class="review-form" data-id="${p.id}">
                <select class="form-control review-rating" name="rating" aria-label="Rating for ${escapeHtml(p.name)}" required>
                  <option value="">Rate</option>
                  <option value="5">5 - Excellent</option>
                  <option value="4">4 - Good</option>
                  <option value="3">3 - Okay</option>
                  <option value="2">2 - Poor</option>
                  <option value="1">1 - Bad</option>
                </select>
                <textarea class="form-control review-text" name="review_text" rows="2" maxlength="1000" placeholder="Write a review" required></textarea>
                <button class="btn btn-secondary review-submit" type="submit">Add Review</button>
              </form>
            </section>
            <div class="product-actions">
              <button class="btn add" data-id="${p.id}" ${out ? 'disabled' : ''}>${out ? 'Unavailable' : 'Add to Cart'}</button>
              <button class="btn btn-secondary wish icon-button" data-id="${p.id}" title="Add to wishlist">Wish</button>
            </div>
          </div>
        `;
      }).join('');
      bindProductActions();
    }

    function bindProductActions() {
      document.querySelectorAll('.add').forEach(b => b.addEventListener('click', async e => {
        if (!isLoggedIn()) return location.href = '/login.html';
        const id = Number(e.currentTarget.dataset.id);
        const res = await addToCart(id, 1);
        showToast(res.message || (res.ok ? 'Added to cart' : 'Unable to add'), res.ok ? 'success' : 'error');
        if (res.ok) {
          await updateNavCounts();
          const product = currentProducts.find(p => Number(p.id) === id);
          if (product) product.stock = Math.max(0, Number(product.stock || 0) - 1);
          applyProductControls();
        }
      }));

      document.querySelectorAll('.wish').forEach(b => b.addEventListener('click', async e => {
        if (!isLoggedIn()) return location.href = '/login.html';
        const id = Number(e.currentTarget.dataset.id);
        const res = await fetchJson('/api/wishlist', {
          method: 'POST',
          body: { product_id: id }
        });
        showToast(res.message || (res.ok ? 'Saved to wishlist' : 'Unable to save'), res.ok ? 'success' : 'error');
        if (res.ok) await updateNavCounts();
      }));

      document.querySelectorAll('.review-form').forEach(form => form.addEventListener('submit', async e => {
        e.preventDefault();
        if (!isLoggedIn()) return location.href = '/login.html';

        const productId = Number(e.currentTarget.dataset.id);
        const body = Object.fromEntries(new FormData(e.currentTarget).entries());
        const button = e.currentTarget.querySelector('.review-submit');
        button.disabled = true;

        const res = await fetchJson(`/api/products/${productId}/reviews`, {
          method: 'POST',
          body
        });

        button.disabled = false;
        showToast(res.message || (res.ok ? 'Review saved' : 'Unable to save review'), res.ok ? 'success' : 'error');

        if (res.ok && res.summary) {
          const product = currentProducts.find(p => Number(p.id) === productId);
          if (product) {
            product.avg_rating = res.summary.avg_rating;
            product.review_count = res.summary.review_count;
          }
          e.currentTarget.reset();
          applyProductControls();
        }
      }));
    }

    await loadProducts();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
